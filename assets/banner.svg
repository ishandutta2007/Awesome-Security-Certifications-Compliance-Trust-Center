<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0e17;border-radius:12px;overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Animated pulses and flows (background layer only) */
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.4; }
    
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    
    .float-orb1 {
      animation: floatSlow 8s ease-in-out infinite alternate;
    }

    .float-orb2 {
      animation: floatSlow2 10s ease-in-out infinite alternate;
    }

    .radar-sweep {
      transform-origin: 1040px 180px;
      animation: rotateSweep 12s linear infinite;
    }

    .glow-line {
      stroke-dasharray: 80 200;
      animation: dashFlow 6s linear infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.96); opacity: 0.35; }
      100% { transform: scale(1.04); opacity: 0.7; }
    }

    @keyframes floatSlow {
      0% { transform: translate(0px, 0px); }
      100% { transform: translate(25px, -20px); }
    }

    @keyframes floatSlow2 {
      0% { transform: translate(0px, 0px); }
      100% { transform: translate(-30px, 20px); }
    }

    @keyframes rotateSweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes dashFlow {
      0% { stroke-dashoffset: 280; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <g class="grid-layer">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="360" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="360" class="grid-line" />
  </g>

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="100" cy="80" r="140" fill="#0284c7" opacity="0.12" filter="url(#glow)" class="float-orb1" />
  <circle cx="1050" cy="260" r="160" fill="#6366f1" opacity="0.12" filter="url(#glow)" class="float-orb2" />
  <circle cx="600" cy="350" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- Animated Radar / Trust Ring in Right Background -->
  <g opacity="0.45">
    <circle cx="1040" cy="180" r="130" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="4 6" />
    <circle cx="1040" cy="180" r="95" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" class="pulse-circle" />
    <circle cx="1040" cy="180" r="60" stroke="#818cf8" stroke-width="1.5" fill="none" opacity="0.6" />
    <circle cx="1040" cy="180" r="6" fill="#38bdf8" filter="url(#softGlow)" />
    <!-- Rotating Sweep Beam -->
    <line x1="1040" y1="180" x2="1040" y2="50" stroke="url(#accentGrad)" stroke-width="2" opacity="0.7" class="radar-sweep" />
  </g>

  <!-- Flowing Dynamic Data Lines (Background Accent) -->
  <path d="M 50 320 Q 300 300 550 330 T 1150 310" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" class="glow-line" />
  <path d="M 50 330 Q 350 350 650 320 T 1150 330" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4" class="glow-line" style="animation-duration: 9s;" />

  <!-- Decorative Shield Icon (Subtle Background Graphic) -->
  <g transform="translate(80, 85) scale(0.85)" opacity="0.25">
    <polygon points="60,10 110,35 110,95 60,135 10,95 10,35" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" />
    <polyline points="35,70 50,85 85,50" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND CONTENT: Title, Badges, and Subtitle (Crisp & Untouched by animations) -->
  <g id="foreground">
    <!-- Top Pill / Badge -->
    <g transform="translate(100, 52)">
      <rect width="320" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <circle cx="16" cy="16" r="4.5" fill="#10b981" />
      <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED TRUST &amp; COMPLIANCE DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="100" y="145" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Security Certifications &amp;
    </text>
    <text x="100" y="200" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
      Compliance Trust Centers 🛡️
    </text>

    <!-- Subtitle / Tagline -->
    <text x="100" y="248" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      Enterprise SaaS &amp; Open-Source Platforms for Continuous Compliance, SOC 2, ISO 27001 &amp; Trust Portals
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(100, 275)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✦ SOC 2 &amp; ISO 27001</text>
      
      <!-- Tag 2 -->
      <rect x="135" y="0" width="135" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="147" y="17" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✦ AI Questionnaires</text>

      <!-- Tag 3 -->
      <rect x="280" y="0" width="120" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="292" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✦ Public Portals</text>

      <!-- Tag 4 -->
      <rect x="410" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="422" y="17" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">✦ Self-Hosted GRC</text>
    </g>
  </g>
</svg>
